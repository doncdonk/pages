<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>道路標識クイズ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E6ECEF; --panel:#FFFFFF; --ink:#1B2530; --muted:#5A6873;
  --blue:#1D4F9C; --blue-soft:#DCE6F5; --yellow:#F2C200;
  --ok:#1E7A46; --ok-soft:#DDF1E4; --ng:#C4262E; --ng-soft:#F8E0E1;
  --line:#C9D3D9; --pole:#9AA5AD; --rare:#8A5A00; --rare-soft:#FFF1C7;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1A2026; --panel:#252D35; --ink:#E9EEF2; --muted:#A3B0BA;
    --blue:#6F9DE8; --blue-soft:#24344D; --ok:#5CC98A; --ok-soft:#1E3A2B;
    --ng:#F07A80; --ng-soft:#40242A; --line:#3A454F; --pole:#56616A;
    --rare:#F2C94C; --rare-soft:#3A3120;
  }
}
:root[data-theme="dark"]{
  --bg:#1A2026; --panel:#252D35; --ink:#E9EEF2; --muted:#A3B0BA;
  --blue:#6F9DE8; --blue-soft:#24344D; --ok:#5CC98A; --ok-soft:#1E3A2B;
  --ng:#F07A80; --ng-soft:#40242A; --line:#3A454F; --pole:#56616A;
  --rare:#F2C94C; --rare-soft:#3A3120;
}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"BIZ UDPGothic","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
  line-height:1.6; min-height:100vh;
}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px 40px}
header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px}
h1{font-size:1.35rem;margin:0;letter-spacing:.02em}
.progress{font-size:.95rem;color:var(--muted);white-space:nowrap}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:20px}
.bar span{display:block;height:100%;background:var(--blue);width:0;transition:width .3s}

.post{display:flex;flex-direction:column;align-items:center;margin:4px 0 18px}
.post svg{width:min(62vw,220px);height:auto;display:block;filter:drop-shadow(0 3px 4px rgba(0,0,0,.18))}
.post .pole{width:14px;height:44px;background:var(--pole);border-radius:0 0 3px 3px;margin-top:-6px}
.cat{font-size:.85rem;color:var(--muted);margin-top:8px;display:flex;gap:8px;align-items:center}
.badge{font-size:.78rem;font-weight:700;color:var(--rare);background:var(--rare-soft);border-radius:4px;padding:1px 7px}

.q{font-size:1.1rem;font-weight:700;text-align:center;margin:0 0 14px}
.choices{display:grid;gap:10px}
.choice{
  font:inherit;font-size:1.02rem;text-align:left;color:var(--ink);
  background:var(--panel);border:2px solid var(--line);border-radius:10px;
  padding:13px 16px;cursor:pointer;display:flex;gap:12px;align-items:center;
}
.choice:hover:not(:disabled){border-color:var(--blue)}
.choice:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.choice .k{flex:none;width:28px;height:28px;border-radius:50%;background:var(--blue-soft);color:var(--blue);
  display:grid;place-items:center;font-weight:700;font-size:.9rem}
.choice.correct{border-color:var(--ok);background:var(--ok-soft)}
.choice.wrong{border-color:var(--ng);background:var(--ng-soft)}
.choice:disabled{cursor:default}

.feedback{margin-top:16px;padding:14px 16px;border-radius:10px;background:var(--panel);border-left:6px solid var(--blue)}
.feedback.ok{border-left-color:var(--ok)}
.feedback.ng{border-left-color:var(--ng)}
.feedback strong{display:block;font-size:1.05rem;margin-bottom:4px}
.feedback p{margin:0;color:var(--muted)}
.src{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-size:.82rem;color:var(--muted);line-height:1.55}
.src b{color:var(--ink);font-weight:700}
.src a{color:var(--blue)}
.btn{
  font:inherit;font-weight:700;font-size:1.05rem;border:none;border-radius:10px;
  padding:14px 20px;background:var(--blue);color:#fff;cursor:pointer;width:100%;margin-top:14px
}
.btn:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.btn.sub{background:transparent;color:var(--blue);border:2px solid var(--blue)}

.result{text-align:center;padding:10px 0}
.score{font-size:3.2rem;font-weight:700;margin:6px 0 0;color:var(--blue)}
.score small{font-size:1.2rem;color:var(--muted)}
.msg{margin:4px 0 20px;color:var(--muted)}
.review h2{font-size:1rem;margin:18px 0 10px}
.miss{display:flex;gap:14px;align-items:center;background:var(--panel);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.miss svg{width:64px;height:64px;flex:none}
.miss div{font-size:.95rem}
.miss b{display:block}
.miss span{color:var(--muted);font-size:.86rem}
.settings{display:grid;grid-template-columns:auto 1fr;gap:10px 12px;align-items:center;max-width:340px;margin:8px auto 4px}
.settings label{font-size:.95rem;color:var(--muted)}
.settings select{font:inherit;padding:6px 8px;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
.count{text-align:center;color:var(--muted);font-size:.9rem;margin:6px 0 0}
.note{font-size:.8rem;color:var(--muted);margin-top:26px;line-height:1.6}
.note a{color:var(--blue)}
.namecard{background:var(--panel);border-radius:12px;padding:18px 16px;margin:4px 0 16px;text-align:center;border-top:6px solid var(--blue)}
.namecard .cat{justify-content:center;margin:0 0 6px}
.bigname{font-size:1.35rem;font-weight:700;margin:0;line-height:1.45}
.imgchoices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choice.img{flex-direction:column;align-items:center;padding:10px;position:relative}
.choice.img .k{position:absolute;top:8px;left:8px}
.choice.img svg{width:100%;max-width:150px;height:auto;display:block}
.namecard.fake{border-top-color:var(--ng)}
.namecard .sub{margin:4px 0 0;color:var(--muted);font-size:.92rem}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.compare figure{margin:0;text-align:center}
.compare svg{width:100%;max-width:120px;height:auto}
.compare figcaption{font-size:.82rem;color:var(--muted);line-height:1.4}
.back{font:inherit;font-size:.95rem;color:var(--blue);background:none;border:none;cursor:pointer;padding:4px 0}
.back:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 12px}
.chip{font:inherit;font-size:.9rem;border:1.5px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:5px 14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff}
.chip:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.search{font:inherit;width:100%;padding:10px 12px;border-radius:8px;border:1.5px solid var(--line);background:var(--panel);color:var(--ink);margin-bottom:10px}
.list h2{font-size:1rem;margin:20px 0 8px;color:var(--muted)}
.item{background:var(--panel);border-radius:10px;margin-bottom:8px}
.item summary{display:flex;gap:14px;align-items:center;padding:8px 12px;cursor:pointer;list-style:none}
.item summary::-webkit-details-marker{display:none}
.item summary:focus-visible{outline:3px solid var(--yellow);outline-offset:2px;border-radius:10px}
.item summary svg{width:58px;height:58px;flex:none}
.item .nm{flex:1;min-width:0}
.item .nm b{display:block;font-size:.98rem;line-height:1.4}
.item .nm span{font-size:.82rem;color:var(--muted)}
.item .body{padding:0 14px 14px}
.item .body .big{display:flex;justify-content:center;margin:4px 0 10px}
.item .body .big svg{width:140px;height:140px}
.item .body p{margin:0;color:var(--muted);font-size:.95rem}
.empty{color:var(--muted);text-align:center;padding:24px 0}
@media (prefers-reduced-motion: reduce){.bar span{transition:none}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
/* ================= SVG部品 ================= */
const RED="#D0262D", BLUE="#1C4FA0", YEL="#F5C400", BLK="#1A1A1A", WHT="#FFFFFF";
const svg = inner => `<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="img">${inner}</svg>`;
const EDGE = `stroke="#bbb" stroke-width="1.5"`;

const ringSign = inner => `<circle cx="100" cy="100" r="97" fill="${WHT}" ${EDGE}/><circle cx="100" cy="100" r="92" fill="${RED}"/><circle cx="100" cy="100" r="74" fill="${WHT}"/>${inner}`;
const blueRing = inner => `<circle cx="100" cy="100" r="97" fill="${WHT}" ${EDGE}/><circle cx="100" cy="100" r="92" fill="${RED}"/><circle cx="100" cy="100" r="74" fill="${BLUE}"/>${inner}`;
const blueDisc = inner => `<circle cx="100" cy="100" r="97" fill="${WHT}" ${EDGE}/><circle cx="100" cy="100" r="91" fill="${BLUE}"/>${inner}`;
const blueSq = inner => `<rect x="6" y="6" width="188" height="188" rx="14" fill="${WHT}" ${EDGE}/><rect x="13" y="13" width="174" height="174" rx="9" fill="${BLUE}"/>${inner}`;
const warn = inner => `<polygon points="100,4 196,100 100,196 4,100" fill="${WHT}" ${EDGE}/><polygon points="100,11 189,100 100,189 11,100" fill="${YEL}"/><polygon points="100,20 180,100 100,180 20,100" fill="none" stroke="${BLK}" stroke-width="5"/><g transform="translate(100 100) scale(.85) translate(-100 -100)">${inner}</g>`;
const tri = inner => `<polygon points="6,22 194,22 100,188" fill="${WHT}" ${EDGE}/><polygon points="17,29 183,29 100,175" fill="${RED}"/>${inner}`;

const slash = `<line x1="48" y1="48" x2="152" y2="152" stroke="${RED}" stroke-width="13"/>`;
const txt = (t, x, y, size, color, w=700) =>
  `<text x="${x}" y="${y}" font-size="${size}" fill="${color}" font-weight="${w}" text-anchor="middle" font-family="BIZ UDPGothic, Hiragino Kaku Gothic ProN, Yu Gothic, sans-serif">${t}</text>`;
const sc = (inner, tx, ty, s) => `<g transform="translate(${tx} ${ty}) scale(${s})">${inner}</g>`;

const walker = (c, x=100, y=100, s=1) => `<g transform="translate(${x},${y}) scale(${s})" stroke="${c}" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none">
  <circle cx="4" cy="-44" r="10" fill="${c}" stroke="none"/><line x1="2" y1="-28" x2="-4" y2="8"/>
  <polyline points="-20,-6 -2,-22 16,-6"/><polyline points="-4,8 -20,40"/><polyline points="-4,8 10,24 12,42"/></g>`;
const bike = c => `<g stroke="${c}" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <circle cx="62" cy="122" r="24"/><circle cx="138" cy="122" r="24"/>
  <polyline points="62,122 90,122 80,88 124,88 138,122"/><line x1="90" y1="122" x2="124" y2="88"/>
  <line x1="72" y1="80" x2="88" y2="80"/><polyline points="124,88 118,72 130,70"/></g>`;
const upArrow = (c, x=100) => `<polygon points="${x-12},160 ${x+12},160 ${x+12},85 ${x+32},85 ${x},42 ${x-32},85 ${x-12},85" fill="${c}"/>`;
const car = (c, bg) => `<path d="M40,122 L44,104 L66,98 L82,78 L122,78 L140,98 L158,104 L160,122 Z" fill="${c}"/>
  <circle cx="68" cy="124" r="13" fill="${c}" stroke="${bg}" stroke-width="3"/><circle cx="132" cy="124" r="13" fill="${c}" stroke="${bg}" stroke-width="3"/>`;
const truck = (c, bg) => `<polygon points="38,128 38,98 50,82 72,82 72,128" fill="${c}"/><rect x="76" y="64" width="82" height="64" fill="${c}"/>
  ${[58,108,140].map(x=>`<circle cx="${x}" cy="130" r="12" fill="${c}" stroke="${bg}" stroke-width="3"/>`).join("")}`;
const bus = (c, bg) => `<rect x="38" y="70" width="124" height="58" rx="8" fill="${c}"/>
  ${[48,74,100,126].map(x=>`<rect x="${x}" y="78" width="20" height="18" rx="2" fill="${bg}"/>`).join("")}
  <circle cx="66" cy="130" r="12" fill="${c}" stroke="${bg}" stroke-width="3"/><circle cx="136" cy="130" r="12" fill="${c}" stroke="${bg}" stroke-width="3"/>`;
const moto = c => `<g stroke="${c}" stroke-linecap="round" stroke-linejoin="round">
  <circle cx="62" cy="128" r="19" fill="none" stroke-width="7"/><circle cx="140" cy="128" r="19" fill="none" stroke-width="7"/>
  <path d="M70,114 L88,96 L124,96 L132,110 L104,120 Z" fill="${c}" stroke-width="4"/>
  <line x1="62" y1="128" x2="88" y2="108" stroke-width="7"/><line x1="140" y1="128" x2="126" y2="82" stroke-width="7"/>
  <line x1="120" y1="80" x2="134" y2="78" stroke-width="7"/><line x1="72" y1="92" x2="100" y2="92" stroke-width="7"/></g>`;
// 右回り（時計回り）の3本の円弧矢印
const roundArrows = (c, big) => {
  const a = big
    ? `<path d="M65.4,80 A40,40 0 0 1 120,65.4" fill="none" stroke="${c}" stroke-width="12"/><polygon points="133.9,73.4 126.5,54.1 113.5,76.7" fill="${c}"/>`
    : `<path d="M70.6,83 A34,34 0 0 1 117,70.6" fill="none" stroke="${c}" stroke-width="11"/><polygon points="130.5,78.4 122.5,61.1 111.5,80.1" fill="${c}"/>`;
  return [0,120,240].map(r=>`<g transform="rotate(${r} 100 100)">${a}</g>`).join("");
};
const turnArrow = (c, dir) => { // 進行方向別通行区分用
  if (dir==="L") return `<path d="M62,166 V102 Q62,88 48,88 H46" fill="none" stroke="${c}" stroke-width="11"/><polygon points="48,72 26,88 48,104" fill="${c}"/>`;
  if (dir==="R") return `<path d="M138,166 V102 Q138,88 152,88 H154" fill="none" stroke="${c}" stroke-width="11"/><polygon points="152,72 174,88 152,104" fill="${c}"/>`;
  return `<rect x="94" y="72" width="12" height="94" fill="${c}"/><polygon points="82,76 100,48 118,76" fill="${c}"/>`;
};

const GRN = "#0E7A4B";
const board = (bg, h, inner, r=10) => `<rect x="4" y="${100-h/2}" width="192" height="${h}" rx="${r}" fill="${WHT}" ${EDGE}/><rect x="9" y="${100-h/2+5}" width="182" height="${h-10}" rx="${Math.max(r-3,2)}" fill="${bg}"/>${inner}`;
const aux = (inner, h=90) => `<rect x="4" y="${100-h/2}" width="192" height="${h}" rx="6" fill="${WHT}" stroke="#8A8A8A" stroke-width="3"/>${inner}`;
// 汎用矢印（deg: 0=右, -90=上, 90=下, 180=左）
const arr = (c, x, y, len, deg, w=10) => `<g transform="translate(${x} ${y}) rotate(${deg})"><polygon points="0,-${w/2} ${len-14},-${w/2} ${len-14},-${w/2+8} ${len},0 ${len-14},${w/2+8} ${len-14},${w/2} 0,${w/2}" fill="${c}"/></g>`;
const tire = c => `<circle cx="100" cy="100" r="52" fill="none" stroke="${c}" stroke-width="16"/><circle cx="100" cy="100" r="18" fill="none" stroke="${c}" stroke-width="6"/>${[0,45,90,135].map(d=>`<line x1="100" y1="36" x2="100" y2="164" stroke="${c}" stroke-width="4" transform="rotate(${d} 100 100)" stroke-dasharray="6 6"/>`).join("")}`;
const tram = c => `<rect x="58" y="80" width="84" height="46" rx="6" fill="${c}"/><polyline points="88,80 100,64 112,80" fill="none" stroke="${c}" stroke-width="4"/><line x1="84" y1="64" x2="116" y2="64" stroke="${c}" stroke-width="4"/>`;
const carTop = (c, x, y, w, h, deg=0) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="5" fill="${c}" transform="rotate(${deg} ${x+w/2} ${y+h/2})"/>`;
const phone = c => `<path d="M58,96 Q100,62 142,96 L142,108 L124,108 L124,98 Q100,86 76,98 L76,108 L58,108 Z" fill="${c}"/><path d="M70,112 H130 L140,140 H60 Z" fill="${c}"/>`;
const toilet = c => `<circle cx="74" cy="66" r="11" fill="${c}"/><rect x="62" y="82" width="24" height="46" rx="4" fill="${c}"/><rect x="64" y="126" width="8" height="30" fill="${c}"/><rect x="76" y="126" width="8" height="30" fill="${c}"/><rect x="98" y="54" width="4" height="104" fill="${c}"/><circle cx="126" cy="66" r="11" fill="${c}"/><polygon points="126,80 146,130 106,130" fill="${c}"/><rect x="116" y="128" width="8" height="28" fill="${c}"/><rect x="128" y="128" width="8" height="28" fill="${c}"/>`;
const wheelchair = c => `<circle cx="92" cy="60" r="10" fill="${c}"/><polyline points="90,74 90,108 122,108 132,134" fill="none" stroke="${c}" stroke-width="8" stroke-linejoin="round"/><circle cx="92" cy="122" r="22" fill="none" stroke="${c}" stroke-width="6"/>`;

const pent = inner => `<polygon points="100,3 182,143 182,196 18,196 18,143" fill="${WHT}" ${EDGE}/><polygon points="100,13 175,145 175,189 25,189 25,145" fill="${BLUE}"/>${inner}`;
const hU = (x,y,c=WHT) => `<polygon points="${x},${y} ${x-20},${y+28} ${x+20},${y+28}" fill="${c}"/>`;
const hL = (x,y,c=WHT) => `<polygon points="${x},${y} ${x+28},${y-20} ${x+28},${y+20}" fill="${c}"/>`;
const hR = (x,y,c=WHT) => `<polygon points="${x},${y} ${x-28},${y-20} ${x-28},${y+20}" fill="${c}"/>`;
const pth = (d,c=WHT,w=16) => `<path d="${d}" fill="none" stroke="${c}" stroke-width="${w}"/>`;
// 道路標示（上から見た路面）
const MY = "#F2B705", MW = "#F4F4F4";
const road = inner => `<rect x="6" y="6" width="188" height="188" rx="14" fill="#55595D" ${EDGE}/>${inner}`;
const edgeL = `<rect x="20" y="6" width="5" height="188" fill="${MW}"/>`, edgeR = `<rect x="175" y="6" width="5" height="188" fill="${MW}"/>`;
const dash = (x,c=MW,w=5) => `<line x1="${x}" y1="6" x2="${x}" y2="194" stroke="${c}" stroke-width="${w}" stroke-dasharray="22 16"/>`;
const solid = (x,c=MW,w=5) => `<rect x="${x-w/2}" y="6" width="${w}" height="188" fill="${c}"/>`;
const walk = `<rect x="6" y="6" width="36" height="188" rx="10" fill="#9EA3A7"/>`;
const rArr = (x,y,deg=-90,c=MW) => arr(c,x,y,56,deg,9);
const tanuki = c => `<ellipse cx="96" cy="112" rx="34" ry="22" fill="${c}"/><circle cx="130" cy="92" r="16" fill="${c}"/><circle cx="124" cy="76" r="6" fill="${c}"/><circle cx="138" cy="76" r="6" fill="${c}"/><path d="M62,106 Q40,96 44,124 Q52,124 64,116 Z" fill="${c}"/><g stroke="${c}" stroke-width="7" stroke-linecap="round"><line x1="76" y1="128" x2="72" y2="146"/><line x1="112" y1="128" x2="116" y2="146"/></g>`;
const rabbit = c => `<ellipse cx="94" cy="118" rx="32" ry="22" fill="${c}"/><circle cx="126" cy="98" r="14" fill="${c}"/><ellipse cx="124" cy="68" rx="6" ry="20" fill="${c}"/><ellipse cx="136" cy="70" rx="6" ry="20" fill="${c}" transform="rotate(15 136 70)"/><circle cx="62" cy="112" r="8" fill="${c}"/><ellipse cx="80" cy="140" rx="18" ry="6" fill="${c}"/>`;
const monkey = c => `<circle cx="100" cy="66" r="14" fill="${c}"/><ellipse cx="100" cy="106" rx="20" ry="28" fill="${c}"/><g stroke="${c}" stroke-width="8" stroke-linecap="round" fill="none"><line x1="84" y1="96" x2="70" y2="120"/><line x1="116" y1="96" x2="130" y2="120"/><line x1="90" y1="130" x2="82" y2="152"/><line x1="110" y1="130" x2="118" y2="152"/><path d="M118,122 Q150,128 140,96" /></g>`;
const sl = c => `<rect x="54" y="90" width="64" height="36" rx="4" fill="${c}"/><rect x="104" y="72" width="40" height="54" fill="${c}"/><rect x="66" y="74" width="12" height="18" fill="${c}"/><rect x="46" y="118" width="104" height="8" fill="${c}"/><circle cx="72" cy="136" r="10" fill="${c}"/><circle cx="100" cy="136" r="10" fill="${c}"/><circle cx="128" cy="136" r="10" fill="${c}"/><line x1="40" y1="150" x2="160" y2="150" stroke="${c}" stroke-width="5"/>`;

/* ================= 標識データ =================
   no: 標識令 別表の番号 / n: 名称 / c: 分類 / r: レア / d: 意味（別表第一「表示する意味」を要約） */
const SIGNS = [

const LAW = "道路標識、区画線及び道路標示に関する命令（昭和35年総理府・建設省令第3号）別表第一・別表第二";
const MARK_URL = "https://www.kictec.co.jp/varieties-road-mark-cat/road-mark-example/";
const MLIT_URL = "https://www.mlit.go.jp/road/sign/sign/douro/ichiran.pdf";
const CATS = ["規制","指示","警戒","案内","補助","道路標示","標示板"];
const catLabel = c => (c === "標示板" || c === "道路標示") ? c : c + "標識";
const srcHTML = s => s.law
  ? `<div class="src"><b>出典</b>　${s.law}「${s.n.replace("（標示板）","")}」<br>※道路標識令の標識ではなく、施行規則に基づく標示板です。<br>参照：<a href="${s.ref[1]}" target="_blank" rel="noopener">${s.ref[0]}</a></div>`
  : s.c === "道路標示"
  ? `<div class="src"><b>出典</b>　${LAW.replace("別表第一・別表第二","別表第五・別表第六")}　${s.no.startsWith("1")?"規制標示":"指示標示"}（${s.no}）「${s.n.replace("（道路標示）","")}」<br>参照：<a href="${MARK_URL}" target="_blank" rel="noopener">キクテック「路面標示のいろいろ」（標示の番号と名称の一覧）</a></div>`
  : `<div class="src"><b>出典</b>　${LAW}　${catLabel(s.c)}（${s.no}）「${s.n}」<br>
  参照：<a href="${MLIT_URL}" target="_blank" rel="noopener">国土交通省 道路局「道路標識一覧」</a></div>`;
const DUP = (() => { const m = {}; SIGNS.forEach(s => m[s.n] = (m[s.n]||0) + 1); return m; })();
const dispName = s => DUP[s.n] > 1 ? `${s.n}（${catLabel(s.c)}）` : s.n;
const noLabel = s => s.law ? s.no : s.c === "道路標示" ? `（標示${s.no}）` : `（${s.no}）`;

  {base:"通行止め", why:"通行止めの×印と文字は赤い×に青い文字。青い×印ではない。", s:ringSign(`<line x1="50" y1="50" x2="150" y2="150" stroke="${BLUE}" stroke-width="12"/><line x1="150" y1="50" x2="50" y2="150" stroke="${BLUE}" stroke-width="12"/>`+txt("通行止",100,166,22,RED))},
  {base:"歩行者等通行止め", why:"歩行者等通行止めには赤い斜線が入る。斜線のない人物だけの規制標識は存在しない。", s:ringSign(walker(BLUE,98,108,1.05))},
  {base:"指定方向外進行禁止（直進のみ）", why:"指定方向外進行禁止は青地に白い矢印。赤地の矢印標識は存在しない。", s:`<circle cx="100" cy="100" r="97" fill="${WHT}" ${EDGE}/><circle cx="100" cy="100" r="91" fill="${RED}"/>`+upArrow(WHT)},
  {base:"踏切あり", why:"踏切ありは黄色のひし形。丸い形の踏切標識は存在しない。", s:`<circle cx="100" cy="100" r="97" fill="${WHT}" ${EDGE}/><circle cx="100" cy="100" r="91" fill="${YEL}"/><circle cx="100" cy="100" r="80" fill="none" stroke="${BLK}" stroke-width="5"/><rect x="52" y="80" width="96" height="50" rx="6" fill="${BLK}"/>${[60,86,112].map(x=>`<rect x="${x}" y="88" width="20" height="16" rx="2" fill="${YEL}"/>`).join("")}<circle cx="70" cy="136" r="7" fill="${BLK}"/><circle cx="130" cy="136" r="7" fill="${BLK}"/>`},
].map(f => ({...f, fake:true, n:"偽物"}));

/* ================= クイズ本体 ================= */
const app = document.getElementById("app");
let qCount = 10, range = "all", qType = "mix", order = [], idx = 0, score = 0, misses = [], answered = false;

const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const pool = () => range === "basic" ? SIGNS.filter(s=>!s.r) : range === "rare" ? SIGNS.filter(s=>s.r) : SIGNS;

const grp = s => s.c + ":" + s.no.replace(/-[A-Z]$/, "");
function makeChoices(sign){
  // 同じ番号の別図柄（左右反転など）は紛らわしすぎるので選択肢から外す
  const ok = s => s !== sign && grp(s) !== grp(sign);
  const same = shuffle(SIGNS.filter(s => ok(s) && s.c === sign.c));
  const other = shuffle(SIGNS.filter(s => ok(s) && s.c !== sign.c));
  const picks = same.slice(0, 3);
  while (picks.length < 3) picks.push(other.shift());
  return shuffle([sign, ...picks]);
}

function makeFakeQ(f){
  const base = SIGNS.find(s => s.n === f.base);
  f.real = base;
  const ok = s => s !== base && grp(s) !== grp(base);
  const same = shuffle(SIGNS.filter(s => ok(s) && s.c === base.c));
  const other = shuffle(SIGNS.filter(s => ok(s) && s.c !== base.c));
  // 本物の元標識を並べる回と並べない回を混ぜる
  const reals = Math.random() < .6 ? [base] : [];
  while (reals.length < 3) reals.push(same.length ? same.shift() : other.shift());
  return {sign:f, choices:shuffle([f, ...reals]), t:"fake"};
}

function start(){
  if (qType === "fake") {
    order = shuffle(FAKES).slice(0, Math.min(qCount, FAKES.length)).map(makeFakeQ);
    idx = 0; score = 0; misses = [];
    renderQuestion(); return;
  }
  const p = pool();
  order = shuffle(p).slice(0, Math.min(qCount, p.length)).map(s => ({
    sign:s, choices:makeChoices(s),
    t: qType === "mix" ? (Math.random() < .5 ? "name" : "img") : qType
  }));
  idx = 0; score = 0; misses = [];
  renderQuestion();
}

function renderQuestion(){
  answered = false;
  const {sign, choices, t} = order[idx];
  const head = `
    <header><h1>道路標識クイズ</h1><div class="progress">${idx+1} / ${order.length}問　正解 ${score}</div></header>
    <div class="bar"><span style="width:${idx/order.length*100}%"></span></div>`;
  if (t === "fake") {
    app.innerHTML = head + `
      <div class="namecard fake"><p class="bigname">偽標識を探せ</p><p class="sub">1つだけ、実在しない偽物の標識が混ざっています。</p></div>
      <p class="q">偽物はどれ？</p>
      <div class="imgchoices">${choices.map((c,i)=>`<button class="choice img" data-i="${i}" aria-label="選択肢${i+1}"><span class="k">${i+1}</span>${svg(c.s)}</button>`).join("")}</div>
      <div id="fb"></div>`;
    app.querySelectorAll(".choice").forEach(b => b.addEventListener("click", () => answer(+b.dataset.i)));
    return;
  }
  const badge = `${catLabel(sign.c)}${sign.r?'<span class="badge">レア</span>':""}`;
  if (t === "img") {
    app.innerHTML = head + `
      <div class="namecard"><div class="cat">${badge}</div><p class="bigname">${dispName(sign)}</p></div>
      <p class="q">この名称の標識はどれ？</p>
      <div class="imgchoices">${choices.map((c,i)=>`<button class="choice img" data-i="${i}" aria-label="選択肢${i+1}"><span class="k">${i+1}</span>${svg(c.s)}</button>`).join("")}</div>
      <div id="fb"></div>`;
  } else {
    app.innerHTML = head + `
      <div class="post">${svg(sign.s)}<div class="pole"></div><div class="cat">${badge}</div></div>
      <p class="q">この標識の意味は？</p>
      <div class="choices">${choices.map((c,i)=>`<button class="choice" data-i="${i}"><span class="k">${i+1}</span><span>${dispName(c)}</span></button>`).join("")}</div>
      <div id="fb"></div>`;
  }
  app.querySelectorAll(".choice").forEach(b => b.addEventListener("click", () => answer(+b.dataset.i)));
}

function answer(i){
  if (answered) return;
  answered = true;
  const {sign, choices, t} = order[idx];
  const ok = choices[i] === sign;
  if (ok) score++; else misses.push({sign, picked:choices[i], t});
  app.querySelectorAll(".choice").forEach((b,j) => {
    b.disabled = true;
    if (choices[j] === sign) b.classList.add("correct");
    else if (j === i) b.classList.add("wrong");
  });
  const last = idx === order.length - 1;
  if (t === "fake") {
    const real = sign.real;
    const pickedReal = !ok ? `<p>選んだ標識は本物の「${dispName(choices[i])}」${noLabel(choices[i])}です。</p>` : "";
    document.getElementById("fb").innerHTML = `
      <div class="feedback ${ok?"ok":"ng"}"><strong>${ok?"正解！見破りました":"不正解"}　偽物は${choices.indexOf(sign)+1}番</strong>
        <div class="compare"><figure>${svg(sign.s)}<figcaption>偽物</figcaption></figure><figure>${svg(real.s)}<figcaption>本物：${dispName(real)}</figcaption></figure></div>
        <p><b>見分けるポイント：</b>${sign.why}</p>${pickedReal}${srcHTML(real)}</div>
      <button class="btn" id="next">${last?"結果を見る":"次の問題へ"}</button>`;
    const nb = document.getElementById("next");
    nb.addEventListener("click", () => { if (last) renderResult(); else { idx++; renderQuestion(); window.scrollTo(0,0); } });
    nb.focus({preventScroll:true});
    return;
  }
  const pickedNote = (!ok && t === "img") ? `<p>選んだ標識は「${dispName(choices[i])}」${noLabel(choices[i])}です。</p>` : "";
  document.getElementById("fb").innerHTML = `
    <div class="feedback ${ok?"ok":"ng"}"><strong>${ok?"正解！":"不正解"}　${dispName(sign)}</strong><p>${sign.d}</p>${pickedNote}${srcHTML(sign)}</div>
    <button class="btn" id="next">${last?"結果を見る":"次の問題へ"}</button>`;
  const nb = document.getElementById("next");
  nb.addEventListener("click", () => { if (last) renderResult(); else { idx++; renderQuestion(); window.scrollTo(0,0); } });
  nb.focus({preventScroll:true});
}

function renderResult(){
  const pct = score / order.length;
  const msg = pct === 1 ? "全問正解です。標識はばっちり覚えています。"
            : pct >= .8 ? "よくできました。間違えた標識を確認しておきましょう。"
            : pct >= .5 ? "あと一息です。下の復習リストで確認しましょう。"
            : "もう一度チャレンジして覚えていきましょう。";
  app.innerHTML = `
    <header><h1>道路標識クイズ</h1><div class="progress">結果</div></header>
    <div class="bar"><span style="width:100%"></span></div>
    <div class="result"><p class="score">${score}<small> / ${order.length}問正解</small></p><p class="msg">${msg}</p></div>
    ${misses.length ? `<div class="review"><h2>間違えた標識</h2>${misses.map(m=> m.t === "fake" ? `
      <div class="miss">${svg(m.sign.s)}<div><b>偽物（本物は「${dispName(m.sign.real)}」）</b><span>あなたの回答：本物の「${dispName(m.picked)}」</span><br><span>${m.sign.why}</span></div></div>` : `
      <div class="miss">${svg(m.sign.s)}<div><b>${m.sign.n}${noLabel(m.sign)}</b><span>あなたの回答：${dispName(m.picked)}${m.t==="img"?"（の標識）":""}</span><br><span>${m.sign.d}</span></div></div>`).join("")}</div>` : ""}
    <button class="btn" id="again">同じ設定でもう一度</button>
    <button class="btn sub" id="home">設定を変える</button>`;
  document.getElementById("again").addEventListener("click", start);
  document.getElementById("home").addEventListener("click", renderStart);
  window.scrollTo(0,0);
}

function renderStart(){
  const nBasic = SIGNS.filter(s=>!s.r).length, nRare = SIGNS.length - nBasic;
  const counts = [5,10,20,30,50];
  const types = [["name","標識 → 名称を選ぶ"],["img","名称 → 標識を選ぶ"],["mix","ミックス"],["fake","偽標識を探せ"]];
  app.innerHTML = `
    <header><h1>道路標識クイズ</h1></header>
    <div class="post">${svg(SIGNS.find(s=>s.no==="327の10").s)}<div class="pole"></div></div>
    <p class="q">全${SIGNS.length}種類の標識から4択で出題します。</p>
    <div class="settings">
      <label for="typ">出題形式</label>
      <select id="typ">${types.map(([v,l])=>`<option value="${v}" ${qType===v?"selected":""}>${l}</option>`).join("")}</select>
      <label for="rng">出題範囲</label>
      <select id="rng">
        <option value="basic" ${range==="basic"?"selected":""}>基本の標識（${nBasic}種）</option>
        <option value="all" ${range==="all"?"selected":""}>すべて・レア含む（${SIGNS.length}種）</option>
        <option value="rare" ${range==="rare"?"selected":""}>レアな標識のみ（${nRare}種）</option>
      </select>
      <label for="cnt">問題数</label>
      <select id="cnt">${counts.map(n=>`<option value="${n}" ${n===qCount?"selected":""}>${n}問</option>`).join("")}<option value="999" ${qCount===999?"selected":""}>範囲内すべて</option></select>
    </div>
    <p class="count" id="cntNote"></p>
    <button class="btn" id="go">スタート</button>
    <button class="btn sub" id="list">出題する標識の一覧を見る</button>
    <p class="note">標識と道路標示の種類・名称・意味は「${LAW}」に基づいています（令和5年改正後の名称）。「左折可」は道路交通法施行規則による標示板です。図柄はブラウザ上で描いた簡略図で、案内標識・補助標識の地名や文字は表示例です。正確な様式は<a href="${MLIT_URL}" target="_blank" rel="noopener">国土交通省の道路標識一覧</a>で確認してください。</p>`;
  const note = () => {
    const fake = qType === "fake";
    const n = Math.min(qCount, fake ? FAKES.length : pool().length);
    document.getElementById("cntNote").textContent = fake ? `今回は${n}問出題します（偽標識は全${FAKES.length}種、出題範囲の設定は使いません）` : `今回は${n}問出題します`;
    document.getElementById("rng").disabled = fake;
  };
  document.getElementById("typ").addEventListener("change", e => { qType = e.target.value; note(); });
  document.getElementById("rng").addEventListener("change", e => { range = e.target.value; note(); });
  document.getElementById("cnt").addEventListener("change", e => { qCount = +e.target.value; note(); });
  document.getElementById("go").addEventListener("click", start);
  document.getElementById("list").addEventListener("click", () => renderList());
  note();
}

/* ================= 標識一覧 ================= */
let listCat = "all", listRare = "all", listQuery = "";
function renderList(){
  const cats = [["all","すべて"], ...CATS.map(c=>[c, catLabel(c)])];
  const rares = [["all","基本＋レア"],["basic","基本のみ"],["rare","レアのみ"]];
  app.innerHTML = `
    <header><h1>標識一覧</h1><button class="back" id="back">← トップへ戻る</button></header>
    <input class="search" id="q" type="search" placeholder="名称や番号で探す（例：駐車、327、路側帯）" value="${listQuery}" aria-label="標識を検索">
    <div class="filters" role="group" aria-label="分類">${cats.map(([v,l])=>`<button class="chip" data-cat="${v}" aria-pressed="${listCat===v}">${l}</button>`).join("")}</div>
    <div class="filters" role="group" aria-label="レア度">${rares.map(([v,l])=>`<button class="chip" data-rare="${v}" aria-pressed="${listRare===v}">${l}</button>`).join("")}</div>
    <div class="list" id="listBody"></div>
    <button class="btn" id="go2">この一覧から出題する設定でトップへ</button>`;
  document.getElementById("back").addEventListener("click", renderStart);
  document.getElementById("go2").addEventListener("click", () => { range = listRare; renderStart(); });
  app.querySelectorAll("[data-cat]").forEach(b => b.addEventListener("click", () => { listCat = b.dataset.cat; renderList(); }));
  app.querySelectorAll("[data-rare]").forEach(b => b.addEventListener("click", () => { listRare = b.dataset.rare; renderList(); }));
  const q = document.getElementById("q");
  q.addEventListener("input", () => { listQuery = q.value; fillList(); });
  fillList();
}
function fillList(){
  const kw = listQuery.trim();
  const items = SIGNS.filter(s =>
    (listCat === "all" || s.c === listCat) &&
    (listRare === "all" || (listRare === "rare" ? s.r : !s.r)) &&
    (!kw || s.n.includes(kw) || s.no.includes(kw) || s.d.includes(kw)));
  const body = document.getElementById("listBody");
  if (!items.length) { body.innerHTML = `<p class="empty">該当する標識がありません。検索語か絞り込みを変えてください。</p>`; return; }
  body.innerHTML = CATS.map(c => {
    const g = items.filter(s => s.c === c);
    if (!g.length) return "";
    return `<h2>${catLabel(c)}（${g.length}種）</h2>` + g.map(s => `
      <details class="item"><summary>${svg(s.s)}<div class="nm"><b>${s.n}</b><span>${noLabel(s)}</span>${s.r?' <span class="badge">レア</span>':""}</div></summary>
      <div class="body"><div class="big">${svg(s.s)}</div><p>${s.d}</p>${srcHTML(s)}</div></details>`).join("");
  }).join("");
}

document.addEventListener("keydown", e => {
  if (!answered && /^[1-4]$/.test(e.key)) { const b = app.querySelector(`.choice[data-i="${+e.key-1}"]`); if (b) b.click(); }
});

renderStart();
</script>
</body>
