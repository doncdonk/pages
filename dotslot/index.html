<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ドット・スロット</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
:root{
  --page:#e7e2f7; --text:#241d3d; --muted:#5d5580;
  --cab:#4a2f8f; --cab-dark:#2c1a5e; --trim:#f2b632; --trim-dark:#9a6a0c;
  --panel:#000; --led:#ffb02e; --led-off:#3a2508;
  --l1:#3fd0ff; --l2:#ffb340; --l3:#8cff6a;
  --btn:#ff4f7b; --btn-dark:#9c1f43; --stop:#f4f1ff;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --page:#120d22; --text:#ece7ff; --muted:#a79fcc; color-scheme:dark; }
}
:root[data-theme="dark"]{ --page:#120d22; --text:#ece7ff; --muted:#a79fcc; color-scheme:dark; }
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;min-height:100%}
body{background:var(--page);color:var(--text);font-family:"DotGothic16","Hiragino Kaku Gothic ProN","Yu Gothic",monospace;display:flex;justify-content:center;padding:16px 10px 28px}
.wrap{width:100%;max-width:520px}
.cab{background:linear-gradient(180deg,var(--cab),var(--cab-dark));border:4px solid #000;border-radius:20px 20px 12px 12px;padding:14px 12px 16px;box-shadow:inset 0 0 0 3px var(--trim),inset 0 0 0 7px var(--cab-dark)}
.displays{display:flex;justify-content:center;gap:14px}
.disp{background:var(--panel);border:3px solid var(--trim);border-radius:6px;padding:4px 10px 2px;text-align:center;min-width:120px}
.disp .lbl{font-size:13px;color:#fff;letter-spacing:.12em;border-bottom:2px solid var(--trim-dark);padding-bottom:2px}
.disp .num{position:relative;font-size:clamp(28px,8vw,40px);line-height:1.1;letter-spacing:.1em;font-variant-numeric:tabular-nums}
.disp .num .ghost{color:var(--led-off)}
.disp .num .val{position:absolute;inset:0;color:var(--led);text-shadow:0 0 8px rgba(255,176,46,.65)}
.machine{display:grid;grid-template-columns:34px 1fr 34px;gap:6px;margin-top:14px}
.ind{position:relative;margin:8px 0}
.pill{position:absolute;left:0;width:34px;height:22px;transform:translateY(-50%);border-radius:50%;border:2px solid #000;display:grid;place-items:center;font-size:14px;color:#000;opacity:.25;transition:opacity .2s}
.pill.on{opacity:1}
.pill.l1{background:var(--l1)} .pill.l2{background:var(--l2)} .pill.l3{background:var(--l3)}
.pill.flash{animation:blink .35s steps(2) infinite}
.reels{position:relative;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:8px;background:#000;border-radius:8px;border:3px solid var(--trim)}
.reel{position:relative;overflow:hidden;aspect-ratio:4/9;background:#fbfaff;border-radius:3px}
.reel::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(rgba(20,10,50,.45),rgba(20,10,50,0) 22%,rgba(20,10,50,0) 78%,rgba(20,10,50,.45))}
.strip{position:absolute;left:0;right:0;top:0;height:calc(100% / 3 * 40);will-change:transform}
.cell{height:calc(100% / 40);display:grid;place-items:center}
.cell svg{width:80%;height:84%;shape-rendering:geometricPrecision}
.reel.bump .strip{animation:bump .15s ease-out}
.lines{position:absolute;inset:8px;width:calc(100% - 16px);height:calc(100% - 16px);pointer-events:none;overflow:visible}
.lines polyline{fill:none;stroke-width:3;vector-effect:non-scaling-stroke;opacity:0;transition:opacity .2s}
.lines polyline.active{opacity:.28}
.lines polyline.win{opacity:1;stroke-width:5;animation:blink .35s steps(2) infinite}
.lines .l1{stroke:var(--l1)} .lines .l2{stroke:var(--l2)} .lines .l3{stroke:var(--l3)}
.stops{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 40px 0;padding:0 11px}
.stopbtn{justify-self:center;width:54px;height:54px;border-radius:50%;border:3px solid #000;background:radial-gradient(circle at 35% 30%,#fff,var(--stop) 45%,#b9b1dc);box-shadow:0 4px 0 #000;cursor:pointer;font:inherit;font-size:12px;color:#2c1a5e}
.stopbtn:disabled{filter:brightness(.55);cursor:default}
.stopbtn:not(:disabled):active{transform:translateY(3px);box-shadow:0 1px 0 #000}
.stopcol{display:flex;flex-direction:column;align-items:center;gap:6px}
.key{font-size:12px;line-height:1;color:#cfc4ff;letter-spacing:.05em}
.acts{display:flex;gap:8px;align-items:center}
.seq{font:inherit;font-size:15px;padding:10px 12px;border-radius:12px;border:3px solid #000;background:var(--stop);color:var(--cab-dark);cursor:pointer;box-shadow:0 4px 0 #000}
.seq:disabled{filter:brightness(.55);cursor:default}
.seq:not(:disabled):active{transform:translateY(3px);box-shadow:0 1px 0 #000}
.autorow{display:flex;justify-content:flex-end;margin-top:12px}
.auto{font:inherit;font-size:14px;padding:7px 14px;border-radius:999px;border:3px solid #000;background:var(--cab-dark);color:#fff;cursor:pointer}
.auto[aria-pressed="true"]{background:var(--l3);color:#000}
.controls{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:16px;flex-wrap:wrap}
.bets{display:flex;gap:6px}
.bet{font:inherit;font-size:14px;padding:8px 10px;border-radius:8px;border:3px solid #000;background:var(--cab-dark);color:#fff;cursor:pointer;box-shadow:0 3px 0 #000}
.bet.sel{background:var(--trim);color:#000}
.bet:disabled{opacity:.6;cursor:default}
.start{font:inherit;font-size:20px;padding:10px 22px;border-radius:12px;border:3px solid #000;background:var(--btn);color:#fff;cursor:pointer;box-shadow:0 5px 0 var(--btn-dark),0 5px 0 3px #000;letter-spacing:.05em}
.start:disabled{filter:grayscale(.7) brightness(.7);cursor:default}
.start:not(:disabled):active{transform:translateY(4px);box-shadow:0 1px 0 var(--btn-dark),0 1px 0 3px #000}
button:focus-visible{outline:3px solid var(--l1);outline-offset:3px}
.msg{margin-top:12px;background:#000;color:var(--l3);border-radius:6px;padding:8px 10px;font-size:15px;min-height:2.4em;display:flex;align-items:center;border:2px solid var(--trim-dark)}
.below{margin-top:18px;color:var(--text)}
.below h2{font-size:17px;font-weight:400;margin:0 0 8px}
.paytable{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px 14px;font-size:15px}
.pay{display:flex;align-items:center;gap:6px}
.pay svg{width:24px;height:24px;flex:none}
.pay b{font-weight:400;margin-left:auto}
.help{color:var(--muted);font-size:14px;line-height:1.7;margin:12px 0 0}
.tools{display:flex;gap:8px;margin-top:12px}
.tool{font:inherit;font-size:14px;padding:6px 12px;border-radius:8px;border:2px solid var(--muted);background:transparent;color:var(--text);cursor:pointer}
@keyframes blink{50%{opacity:.15}}
@keyframes bump{0%{translate:0 3px}100%{translate:0 0}}
@media (prefers-reduced-motion: reduce){.lines polyline.win,.pill.flash{animation:none}.reel.bump .strip{animation:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="cab">
    <div class="displays">
      <div class="disp"><div class="lbl">CREDIT</div><div class="num"><span class="ghost">8888</span><span class="val" id="credit">0100</span></div></div>
      <div class="disp"><div class="lbl">PAYOUT</div><div class="num"><span class="ghost">8888</span><span class="val" id="payout">0000</span></div></div>
    </div>
    <div class="machine">
      <div class="ind" id="indL"></div>
      <div class="reels">
        <div class="reel"><div class="strip"></div></div>
        <div class="reel"><div class="strip"></div></div>
        <div class="reel"><div class="strip"></div></div>
        <svg class="lines" id="lines" viewBox="0 0 3 3" preserveAspectRatio="none"></svg>
      </div>
      <div class="ind" id="indR"></div>
    </div>
    <div class="stops">
      <div class="stopcol"><button class="stopbtn" data-i="0" aria-label="左リールを止める（Z）">STOP</button><span class="key">Z</span></div>
      <div class="stopcol"><button class="stopbtn" data-i="1" aria-label="中リールを止める（X）">STOP</button><span class="key">X</span></div>
      <div class="stopcol"><button class="stopbtn" data-i="2" aria-label="右リールを止める（C）">STOP</button><span class="key">C</span></div>
    </div>
    <div class="controls">
      <div class="bets">
        <button class="bet" data-b="1">1枚</button>
        <button class="bet" data-b="2">2枚</button>
        <button class="bet" data-b="3">3枚</button>
      </div>
      <div class="acts">
        <button class="seq" id="seq">順次ストップ</button>
        <button class="start" id="start">スタート</button>
      </div>
    </div>
    <div class="autorow"><button class="auto" id="auto" aria-pressed="false">オートプレイ：オフ</button></div>
    <div class="msg" id="msg">掛け枚数を選んでスタート</div>
  </div>

  <div class="below">
    <h2>配当（1ラインあたり）</h2>
    <div class="paytable" id="paytable"></div>
    <p class="help">1枚で中段、2枚で上中下段、3枚で斜めを含む5ラインが有効になります。<br>キーボード：スペースでスタート／左から順に停止、Z・X・Cで各リール停止、1〜3で掛け枚数、Aでオートプレイ切り替え。<br>オートプレイはクレジットが0になるか、ボタンを押すまで続きます。掛け枚数に足りなくなったら、残りの枚数に合わせて自動で減らします。</p>
    <div class="tools">
      <button class="tool" id="mute">音：オン</button>
      <button class="tool" id="reset">クレジットを100に戻す</button>
    </div>
  </div>
</div>

<script>
const SVG={
 seven:'<svg viewBox="0 0 32 32"><path d="M6 5h20v5l-9 17h-7l8-15H11v3H6z" fill="#e8202a" stroke="#4a0710" stroke-width="2" stroke-linejoin="round"/><path d="M8 7.5h16" stroke="#ffd34d" stroke-width="1.5"/></svg>',
 bar:'<svg viewBox="0 0 32 32"><rect x="2.5" y="9" width="27" height="14" rx="2" fill="#1d1a2e" stroke="#f2b632" stroke-width="2"/><text x="16" y="20.3" text-anchor="middle" font-family="Arial Black,Arial,sans-serif" font-weight="900" font-size="9.5" fill="#f2b632">BAR</text></svg>',
 bell:'<svg viewBox="0 0 32 32"><path d="M16 4c-6 0-9 5-9 11v6l-3 4h24l-3-4v-6c0-6-3-11-9-11z" fill="#ffc928" stroke="#6b4700" stroke-width="1.6" stroke-linejoin="round"/><circle cx="16" cy="27" r="2.5" fill="#d99a00" stroke="#6b4700"/><path d="M11 11c.8-2 2-3.3 4-4" stroke="#fff6c2" stroke-width="2" fill="none" stroke-linecap="round"/></svg>',
 gem:'<svg viewBox="0 0 32 32"><path d="M9 6h14l6 8-13 14L3 14z" fill="#3fb6ff" stroke="#0b3560" stroke-width="1.6" stroke-linejoin="round"/><path d="M3 14h26M12 14l4-8 4 8M12 14l4 14 4-14" stroke="#0b3560" stroke-width="1" fill="none" opacity=".55"/><path d="M10 9l-3 4" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/></svg>',
 grape:'<svg viewBox="0 0 32 32"><path d="M16 7l2-4" stroke="#5a3a12" stroke-width="2" stroke-linecap="round"/><path d="M17 6c3-3 7-3 9 0-3 2-6 2-9 0z" fill="#56c45a" stroke="#1f5e22"/><g fill="#8a3fd1" stroke="#3a1260" stroke-width="1.2"><circle cx="11" cy="11" r="4"/><circle cx="21" cy="11" r="4"/><circle cx="16" cy="12" r="4"/><circle cx="13" cy="17.5" r="4"/><circle cx="19" cy="17.5" r="4"/><circle cx="16" cy="23.5" r="4"/></g><g fill="#e3c8ff"><circle cx="10" cy="10" r="1"/><circle cx="15" cy="11" r="1"/><circle cx="12" cy="16.5" r="1"/></g></svg>',
 cherry:'<svg viewBox="0 0 32 32"><path d="M17 5C14 12 11 15 10 18M17 5c1 7 4 10 5 14" stroke="#2f7f2f" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M17 5c4-2.5 8-1.5 10 1.5-4 1.5-7 .5-10-1.5z" fill="#56c45a" stroke="#1f5e22"/><circle cx="10" cy="22" r="6" fill="#d81b3a" stroke="#4a0710" stroke-width="1.5"/><circle cx="22" cy="23" r="6" fill="#d81b3a" stroke="#4a0710" stroke-width="1.5"/><circle cx="8" cy="20" r="1.6" fill="#fff" opacity=".85"/><circle cx="20" cy="21" r="1.6" fill="#fff" opacity=".85"/></svg>'
};
const STRIPS=[
 ['seven','grape','bell','cherry','gem','grape','bar','bell','grape','gem','cherry','seven','grape','bell','gem','bar','grape','cherry','bell','gem'],
 ['grape','seven','gem','bell','grape','cherry','bar','gem','grape','bell','seven','cherry','gem','grape','bell','bar','grape','gem','cherry','bell'],
 ['bell','gem','seven','grape','cherry','bell','bar','grape','gem','bell','grape','seven','cherry','gem','grape','bar','bell','gem','grape','cherry']
];
const N=20, SPEED=12; // コマ/秒
const PAY={seven:100,bar:40,bell:12,gem:10,grape:6,cherry:8};
const NAMES={seven:'セブン',bar:'BAR',bell:'ベル',gem:'ダイヤ',grape:'ぶどう',cherry:'チェリー'};
const LINES=[
 {lv:1,rows:[1,1,1]},
 {lv:2,rows:[0,0,0]},{lv:2,rows:[2,2,2]},
 {lv:3,rows:[0,1,2]},{lv:3,rows:[2,1,0]}
];
const $=s=>document.querySelector(s);
const KEY='dotslot.credit';
let credit=100,payout=0,bet=3,state='idle',allowStop=false,muted=false;
try{const v=localStorage.getItem(KEY);if(v!==null&&!isNaN(parseInt(v,10)))credit=Math.max(0,Math.min(9999,parseInt(v,10)));}catch(e){}
function save(){try{localStorage.setItem(KEY,String(credit))}catch(e){}}

/* リール */
const reelEls=[...document.querySelectorAll('.reel')];
const reels=STRIPS.map((s,i)=>{
  const strip=reelEls[i].querySelector('.strip');
  strip.innerHTML=[...s,...s].map(k=>`<div class="cell">${SVG[k]}</div>`).join('');
  return {s,strip,pos:Math.floor(Math.random()*N),state:'stopped',target:0};
});
function draw(r){const m=((r.pos%N)+N)%N;r.strip.style.transform=`translateY(${-(m/(2*N))*100}%)`;}
reels.forEach(draw);

/* ライン表示 */
const svgNS='http://www.w3.org/2000/svg';
const lineEls=LINES.map(L=>{
  const [a,b,c]=L.rows.map(r=>r+.5);
  const pts=[[0,a-(b-a)*.5],[.5,a],[1.5,b],[2.5,c],[3,c+(c-b)*.5]].map(p=>p.join(',')).join(' ');
  const pl=document.createElementNS(svgNS,'polyline');
  pl.setAttribute('points',pts);pl.setAttribute('class','l'+L.lv);
  $('#lines').appendChild(pl);return pl;
});
const PILLS=[{t:0,lv:3},{t:16.667,lv:2},{t:50,lv:1},{t:83.333,lv:2},{t:100,lv:3}];
const pillEls=[];
['#indL','#indR'].forEach(id=>PILLS.forEach(p=>{
  const d=document.createElement('div');d.className='pill l'+p.lv;d.textContent=p.lv;d.style.top=p.t+'%';d.dataset.lv=p.lv;
  $(id).appendChild(d);pillEls.push(d);
}));

/* 配当表 */
$('#paytable').innerHTML=Object.keys(PAY).map(k=>`<div class="pay">${SVG[k].repeat(3)}<b>${PAY[k]}枚</b></div>`).join('')+
 `<div class="pay">${SVG.cherry}${SVG.cherry}<span style="opacity:.5">…</span><b>4枚</b></div><div class="pay">${SVG.cherry}<span style="opacity:.5">……</span><b>2枚</b></div>`;

/* 音 */
let ac=null;
function tone(f,d,type='square',v=.05,when=0,slide){
  if(muted)return;
  try{
    ac=ac||new(window.AudioContext||window.webkitAudioContext)();
    const t=ac.currentTime+when,o=ac.createOscillator(),g=ac.createGain();
    o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);
    g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g).connect(ac.destination);o.start(t);o.stop(t+d+.02);
  }catch(e){}
}
const sfx={
  start:()=>tone(220,.25,'square',.04,0,880),
  stop:()=>tone(150,.08,'square',.07),
  coin:()=>tone(1320,.045,'square',.025),
  win:()=>[660,880,1100].forEach((f,i)=>tone(f,.12,'square',.045,i*.09)),
  big:()=>[523,659,784,1047,784,1047,1319].forEach((f,i)=>tone(f,.15,'square',.05,i*.11)),
  err:()=>tone(110,.2,'sawtooth',.04)
};

/* 表示更新 */
const pad=n=>String(n).padStart(4,'0');
function updateDisp(){$('#credit').textContent=pad(credit);$('#payout').textContent=pad(payout);}
function msg(t){$('#msg').textContent=t;}
function updateButtons(){
  document.querySelectorAll('.stopbtn').forEach((b,i)=>b.disabled=auto||!(state==='spinning'&&allowStop&&reels[i].state==='spin'));
  $('#seq').disabled=auto||!(state==='spinning'&&allowStop&&reels.some(r=>r.state==='spin'));
  $('#start').disabled=auto||state!=='idle';
  document.querySelectorAll('.bet').forEach(b=>{b.disabled=auto||state!=='idle';b.classList.toggle('sel',+b.dataset.b===bet);});
  pillEls.forEach(p=>p.classList.toggle('on',+p.dataset.lv<=bet));
  lineEls.forEach((l,i)=>l.classList.toggle('active',LINES[i].lv<=bet));
}
function clearWins(){lineEls.forEach(l=>l.classList.remove('win'));pillEls.forEach(p=>p.classList.remove('flash'));}

/* ゲーム進行 */
let last=0,raf=0;
function frame(t){
  const dt=Math.min(.05,(t-last)/1000);last=t;
  let moving=false;
  reels.forEach((r,i)=>{
    if(r.state==='spin'||r.state==='stopping'){
      r.pos-=SPEED*dt;
      if(r.state==='stopping'&&r.pos<=r.target){r.pos=((r.target%N)+N)%N;r.state='stopped';draw(r);onReelStop(i);}
      else moving=true;
    }
    draw(r);
  });
  raf=moving?requestAnimationFrame(frame):0;
}
function start(){
  if(state!=='idle')return;
  if(credit<bet){msg(credit===0?'クレジットがありません。下のボタンで100に戻せます':'クレジットが足りません。掛け枚数を減らしてください');sfx.err();return;}
  credit-=bet;payout=0;save();updateDisp();clearWins();
  state='spinning';allowStop=false;
  reels.forEach(r=>r.state='spin');
  sfx.start();msg('ストップボタンでリールを止めよう');
  setTimeout(()=>{allowStop=true;updateButtons();},350);
  updateButtons();
  last=performance.now();if(!raf)raf=requestAnimationFrame(frame);
}
function stopReel(i){
  const r=reels[i];
  if(state!=='spinning'||!allowStop||r.state!=='spin')return;
  r.state='stopping';r.target=Math.floor(r.pos);updateButtons();
}
function onReelStop(i){
  const el=reelEls[i];el.classList.remove('bump');void el.offsetWidth;el.classList.add('bump');
  sfx.stop();updateButtons();
  if(reels.every(r=>r.state==='stopped'))evaluate();
}
const sym=(i,row)=>reels[i].s[(reels[i].pos+row)%N];
function evaluate(){
  const wins=[];let total=0;
  LINES.forEach((L,idx)=>{
    if(L.lv>bet)return;
    const [a,b,c]=L.rows.map((row,i)=>sym(i,row));
    let p=0,k=null;
    if(a===b&&b===c){p=PAY[a];k=a;}
    else if(a==='cherry'){p=b==='cherry'?4:2;k='cherry';}
    if(p){wins.push({idx,p,k});total+=p;}
  });
  if(!total){state='idle';msg('はずれ。もう一回！');updateButtons();if(auto)later(autoStart,550);return;}
  state='paying';updateButtons();
  wins.forEach(w=>{lineEls[w.idx].classList.add('win');pillEls.forEach(p=>{if(+p.dataset.lv===LINES[w.idx].lv)p.classList.add('flash');});});
  const top=wins.reduce((a,b)=>b.p>a.p?b:a);
  if(top.k==='seven'){msg(`セブンがそろった！ ${total}枚獲得`);sfx.big();}
  else if(top.k==='bar'){msg(`BARがそろった！ ${total}枚獲得`);sfx.big();}
  else{msg(`${NAMES[top.k]}で${total}枚獲得`);sfx.win();}
  payOut(total);
}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
async function payOut(total){
  const step=total>=40?3:1;
  while(payout<total){
    const d=Math.min(step,total-payout);payout+=d;credit=Math.min(9999,credit+d);
    updateDisp();sfx.coin();await wait(45);
  }
  save();state='idle';updateButtons();
  if(auto)later(autoStart,900);
}
function setBet(b){if(state!=='idle'||auto)return;bet=b;updateButtons();}
function stopNext(){const i=reels.findIndex(r=>r.state==='spin');if(i>=0)stopReel(i);}

/* オートプレイ */
let auto=false,autoTimers=[];
function later(fn,ms){autoTimers.push(setTimeout(fn,ms));}
function setAuto(on){
  auto=on;autoTimers.forEach(clearTimeout);autoTimers=[];
  const b=$('#auto');b.setAttribute('aria-pressed',String(on));b.textContent=on?'オートプレイ：オン':'オートプレイ：オフ';
  updateButtons();
  if(on){msg('オートプレイ中');if(state==='idle')later(autoStart,300);}
  else if(state==='spinning')msg('オートプレイを止めました。残りのリールは手動で止めてください');
  else msg('オートプレイを止めました');
}
function autoStart(){
  if(!auto||state!=='idle')return;
  if(credit<bet){
    if(credit<=0){setAuto(false);msg('クレジットが0になったので、オートプレイを終了しました');sfx.err();return;}
    bet=credit;updateButtons();
  }
  start();
  let t=650+Math.random()*300;
  [0,1,2].forEach(i=>{t+=250+Math.random()*350;later(()=>stopReel(i),t);});
}

/* 入力 */
document.querySelectorAll('.stopbtn').forEach(b=>b.addEventListener('click',e=>{stopReel(+b.dataset.i);}));
document.querySelectorAll('.bet').forEach(b=>b.addEventListener('click',()=>setBet(+b.dataset.b)));
$('#start').addEventListener('click',start);
$('#seq').addEventListener('click',stopNext);
$('#auto').addEventListener('click',()=>setAuto(!auto));
$('#mute').addEventListener('click',()=>{muted=!muted;$('#mute').textContent=muted?'音：オフ':'音：オン';});
$('#reset').addEventListener('click',()=>{if(state!=='idle')return;credit=100;payout=0;save();updateDisp();clearWins();msg('クレジットを100に戻しました');});
addEventListener('keydown',e=>{
  if(e.repeat||e.metaKey||e.ctrlKey||e.altKey)return;
  const k=e.key.toLowerCase();
  if(k==='a'){setAuto(!auto);return;}
  if(auto){if(k===' '||k==='enter')e.preventDefault();return;}
  if(k===' '||k==='enter'){
    e.preventDefault();
    if(state==='idle')start();
    else if(state==='spinning')stopNext();
  }
  else if(k==='z')stopReel(0);else if(k==='x')stopReel(1);else if(k==='c')stopReel(2);
  else if(k==='1'||k==='2'||k==='3')setBet(+k);
});
updateDisp();updateButtons();
</script>
</body>
